# nginx/default.conf – nginx configuration for the PHP-FPM WordPress variant.
# This file is mounted into the nginx container at /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Pass PHP requests to the wordpress-fpm container
    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   wordpress-fpm:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # WordPress pretty permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Deny access to sensitive files
    location ~ /\.(ht|git|env) {
        deny all;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
        access_log    off;
    }
}
